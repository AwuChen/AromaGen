<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    h2 { font-size: 17px; margin-top: 0; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .muted { color: #666; font-size: 13px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
    input[type=text], input[type=number] { width: 100%; padding: 8px; font-size: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #2a78d6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 14px; }
    button:disabled { background: #aac4e8; cursor: not-allowed; }
    button.secondary { background: #eee; color: #1a1a1a; }
    .option-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    .option-slot { font-weight: 700; width: 22px; }
    .option-kind { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #f0f0f0; }
    .option-kind.aromagen_target, .option-kind.aromagen_near { background: #e3edfb; color: #1c4f9c; }
    .option-kind.real_near, .option-kind.real_far { background: #f5eee0; color: #8a5a00; }
    .target-word { font-size: 26px; font-weight: 800; margin: 4px 0 2px; }
    .progress { font-size: 13px; color: #666; margin-bottom: 8px; }
    .odorant-list { columns: 2; font-size: 14px; }
    .target-list { font-size: 13px; columns: 2; }
    .countdown { font-size: 14px; color: #b45309; margin-top: 10px; }
    .error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>AromaGen Internal Pilot Study &mdash; Data Collection</h1>
  <div class="muted">Participant: <strong><?= pid ?></strong> &middot; Experimenter-operated. Participant is blindfolded and does not view this screen.</div>

  <div id="app"><p class="muted">Loading session&hellip;</p></div>

<script>
var currentParticipant = <?!= JSON.stringify(pid) ?>;

function renderView(view) {
  if (!view.found) {
    document.getElementById('app').innerHTML = '<div class="card error">No session found for this participant. Return to the admin panel and generate them first.</div>';
    return;
  }
  if (view.screen === 'briefing') return renderBriefing(view);
  if (view.screen === 'cartridge_check') return renderCartridgeCheck(view);
  if (view.screen === 'trial') return renderTrial(view);
  if (view.screen === 'done') return renderDone(view);
}

function showError(err) {
  var box = document.getElementById('app');
  var div = document.createElement('div');
  div.className = 'error';
  div.textContent = 'Error: ' + (err && err.message ? err.message : err);
  box.prepend(div);
}

function renderBriefing(view) {
  document.getElementById('app').innerHTML =
    '<div class="card">' +
    '<h2>Briefing</h2>' +
    '<p>Read to the participant (adapt to your own words as needed):</p>' +
    '<p><em>"Thank you for taking part in this study. You\'ll be smelling a series of scents. ' +
    'For each one, I\'ll tell you a word describing a target smell, let you smell a reference example, ' +
    'and ask how familiar it is to you. Then I\'ll present four different scents one at a time, and I\'d ' +
    'like you to tell me which one best matches the target word and reference smell you were given. ' +
    'You\'ll also rate how confident you are in each choice. There will be a short break between each one. ' +
    'You\'ll be blindfolded for the smelling portion. There are no right or wrong answers we\'re testing ' +
    'you on personally -- we\'re evaluating the scents themselves. Let me know if you have any questions ' +
    'before we begin."</em></p>' +
    '<p class="muted">Once the participant is blindfolded and ready, click Next.</p>' +
    '<button onclick="submitAck(\'briefing\')">Next</button>' +
    '</div>';
}

function renderCartridgeCheck(view) {
  var restNote = view.isRestBreak
    ? '<p><strong>Give the participant a short rest break now.</strong> Then swap the device cartridge to the set below before continuing.</p>'
    : '<p>Confirm the physical device cartridge is loaded with the set below before starting.</p>';
  var odorantsHtml = '<div class="odorant-list"><ol>' +
    view.odorants.map(function (o) { return '<li>' + escapeHtml(o) + '</li>'; }).join('') +
    '</ol></div>';
  var targetsHtml = '<div class="target-list"><ol>' +
    view.targets.map(function (t) { return '<li>' + escapeHtml(t.target) + ' <span class="muted">(' + escapeHtml(t.cluster) + ')</span></li>'; }).join('') +
    '</ol></div>';

  document.getElementById('app').innerHTML =
    '<div class="card">' +
    '<h2>Block ' + view.blockNumber + ' of 2 &mdash; Cartridge check</h2>' +
    restNote +
    '<p><strong>Active odorant set: ' + escapeHtml(view.odorantSetLabel) + '</strong></p>' +
    odorantsHtml +
    '<p><strong>Upcoming ' + view.targets.length + ' target descriptors this block (sanity check):</strong></p>' +
    targetsHtml +
    '<button onclick="submitAck(\'cartridge_check\')">' + (view.isRestBreak ? 'Start again' : 'Start') + '</button>' +
    '</div>';
}

function submitAck(kind) {
  var fn = kind === 'briefing' ? 'submitBriefingAck' : 'submitCartridgeCheckAck';
  google.script.run.withSuccessHandler(renderView).withFailureHandler(showError)[fn](currentParticipant);
}

var KIND_LABEL = {
  aromagen_target: 'AromaGen device composition',
  aromagen_near: 'AromaGen device composition',
  real_near: 'Real physical object',
  real_far: 'Real physical object'
};

function renderTrial(view) {
  var optionsHtml = view.options.map(function (opt, i) {
    return '<div class="option-row">' +
      '<span class="option-slot">' + (i + 1) + '.</span>' +
      '<span class="option-kind ' + opt.kind + '">' + KIND_LABEL[opt.kind] + '</span>' +
      '<span>' + escapeHtml(opt.word) + '</span>' +
      '</div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="card">' +
    '<div class="progress">Block ' + view.blockNumber + ' of 2 (' + escapeHtml(view.odorantSetLabel) + ') &middot; ' +
    'Trial ' + view.trialNumber + ' of ' + view.totalTrialsInBlock + '</div>' +
    '<div class="target-word">' + escapeHtml(view.target) + '</div>' +
    '<div class="muted">Cluster: ' + escapeHtml(view.cluster) + '</div>' +

    '<h2 style="margin-top:20px;">Step 1</h2>' +
    '<p>Present a <strong>real physical example</strong> of &ldquo;' + escapeHtml(view.target) + '&rdquo; directly to the participant to smell.</p>' +
    '<label>Familiarity with this smell (1 = not at all familiar, 7 = extremely familiar)</label>' +
    '<input type="number" id="familiarity" min="1" max="7" step="1">' +

    '<h2 style="margin-top:20px;">Step 2</h2>' +
    '<p>Present the following 4 smells to the participant, one at a time, in this order:</p>' +
    optionsHtml +
    '<p class="muted">Options tagged &ldquo;AromaGen device composition&rdquo; must be triggered by you on the actual AromaGen app/device (this control panel cannot do it for you) using the word shown, with the current block\'s odorant set loaded.</p>' +

    '<label>Which numbered smell did the participant pick? (1-4)</label>' +
    '<input type="number" id="selectedSlot" min="1" max="4" step="1">' +

    '<label>Participant\'s confidence in that choice (1 = not at all confident, 7 = extremely confident)</label>' +
    '<input type="number" id="confidence" min="1" max="7" step="1">' +

    '<div id="trialError" class="error"></div>' +
    '<button id="submitTrialBtn" onclick="submitTrial()">Submit &amp; start 10s break</button>' +
    '<div id="countdownBox" class="countdown"></div>' +
    '</div>';
}

function submitTrial() {
  var fam = Number(document.getElementById('familiarity').value);
  var sel = Number(document.getElementById('selectedSlot').value);
  var conf = Number(document.getElementById('confidence').value);
  var err = document.getElementById('trialError');
  err.textContent = '';
  if (!(fam >= 1 && fam <= 7)) { err.textContent = 'Familiarity must be 1-7.'; return; }
  if (!(sel >= 1 && sel <= 4)) { err.textContent = 'Selected smell must be 1-4.'; return; }
  if (!(conf >= 1 && conf <= 7)) { err.textContent = 'Confidence must be 1-7.'; return; }

  document.getElementById('submitTrialBtn').disabled = true;
  google.script.run.withSuccessHandler(function (nextView) {
    startCountdown(10, function () { renderView(nextView); });
  }).withFailureHandler(function (e) {
    document.getElementById('submitTrialBtn').disabled = false;
    showError(e);
  }).submitTrial(currentParticipant, fam, sel, conf);
}

function startCountdown(seconds, onDone) {
  var box = document.getElementById('countdownBox');
  var remaining = seconds;
  box.textContent = 'Break: ' + remaining + 's before the next trial...';
  var interval = setInterval(function () {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(interval);
      onDone();
    } else {
      box.textContent = 'Break: ' + remaining + 's before the next trial...';
    }
  }, 1000);
}

function renderDone(view) {
  document.getElementById('app').innerHTML =
    '<div class="card">' +
    '<h2>Session complete</h2>' +
    '<p>Both blocks finished for <strong>' + escapeHtml(view.participantName) + '</strong>. Thank the participant and remove the blindfold.</p>' +
    '<p class="muted">Close this tab and return to the admin panel to open the next participant\'s link.</p>' +
    '</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

google.script.run.withSuccessHandler(renderView).withFailureHandler(showError).startPilotSession(currentParticipant);
</script>
</body>
</html>
